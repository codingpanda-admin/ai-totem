[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-totem"
version = "0.1.0"
description = "Local, transparent checks for conversational continuity by Coding Panda"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Coding Panda"}]
keywords = ["agents", "continuity", "evaluation", "privacy"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.urls]
Source = "https://github.com/codingpanda-admin/ai-totem"
Issues = "https://github.com/codingpanda-admin/ai-totem/issues"

[project.scripts]
ai-totem = "ai_totem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_totem = ["data/*.json"]
